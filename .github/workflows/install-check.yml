name: install-check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  install-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check Node version
        run: node --version
      - name: Run tests
        run: npm test
      - name: Offline radar run on a saved page
        run: node src/radar/cli.js --file test/fixtures/fl.synthetic.html
      - name: Build showcase page
        run: node src/vitrina/build.js
